[project]
name = "fstack"
dynamic = ["version"]  # from src/fstack/__init__.py
description = "Starts projects from shared templates and brings template updates into them: FastAPI + llmfy + MySQL + React/Vite by default, any repo as a template."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
fstack = "fstack.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/fstack/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fstack"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "fstack/templates"

[tool.pytest.ini_options]
testpaths = ["tests"]
